<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/TelaLoginDoc.css">
    <title>Tela login Docente</title>
</head>
<body>

    <main>

        <div class="divmainlogdoc">

            <div class="esquerda">
                <img src="../../../assets/Banner.png" class="bannerdiv">
            </div>

            <div class="direita">
                <div class="bottit">
                    <div class="divbutvot">
                        <a class="botao-voltar"> ← </a>
                    </div>
                    <h1>Login</h1>
                </div>

                <form>
                        <div class="divform">
                            <h4>SIAPE</h4>
                            <input type="number" id="SIAPE" name="SIAPE" required>
                        </div>

                        <div class="divform">
                            <h4>Senha</h4>
                            <input type="password" id="Senha" name="Senha" required>
                        </div>

                        <div class="divesque">
                            <a>Esqueceu a senha?</a>
                        </div>
            
                        <button type="submit" class="butentrardoc" >Entrar</button>

                        <p class="naotem">Não tem uma conta? <a><b>Cadastre-se</b></a></p>
                </form>

            </div>

        </div>
    </main>
</body>
</html>
