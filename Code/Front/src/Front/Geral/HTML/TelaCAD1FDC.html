<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/TelaCad1Doc.css">
    <title>Seus Dados</title>

</head>
<body>

    <main>
        <div class="divmain">
            <div class="esquerda">
                <img src="../../../assets/Banner.png" class="banner">
            </div>

            <div class="direita">
                <div class="titulo">
                    <h2 class="seta">く</h2>
                    <h2 class="seus">Seus Dados</h2>
                </div>

                <form>
                    <div class="divinput">
                        <h3>Nome de usuário</h3>
                        <input type="text" id="nome" name="nome" placeholder="nome">
                    </div>

                    <div class="divinput">
                        <h3>SIAPE</h3>
                        <input type="number" id="SIAPE" name="SIAPE" placeholder="número de identificação">
                    </div>

                    <div class="divinput">
                        <h3>Senha</h3>
                        <input type="password" id="senha" name="senha" placeholder="senha">
                    </div>

                    <div class="divinput">
                        <h3>Confirmar senha</h3>
                        <input type="password" id="consenha" name="consenha" placeholder="senha">
                    </div>

                    <div class="progresso">
                        <div class="barra ativa"></div>
                        <div class="barra"></div>
                        <div class="barra"></div>
                        <div class="barra"></div>
                    </div>

                    <button type="submit" class="butconti1doc">Continuar</button>

                    <p class="jatem">Já tem uma conta? <a><b>Faça login</b></a></p>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
