<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/TelaLoginDoc.css">
    <title>Login - Docente</title>
</head>
<body>

    <main>
        <div class="divmainlogdoc">

            <div class="esquerda">
                <img src="../../../assets/Banner.png" class="bannerdiv" alt="Banner do IFCE">
            </div>

            <div class="direita">

                <div class="bottit">
                    <div class="divbutvot">
                        <a href="TelaLogin.html" class="botao-voltar" aria-label="Voltar">←</a>
                    </div>
                    <h1>Login</h1>
                </div>

                <form id="formLoginDoc">
                    <div class="divform">
                        <h4><label for="siape">SIAPE</label></h4>
                        <input type="text" inputmode="numeric" id="siape" name="siape" required>
                    </div>

                    <div class="divform">
                        <h4><label for="senha">Senha</label></h4>
                        <input type="password" id="senha" name="senha"
                               autocomplete="current-password" required>
                    </div>

                    <div class="divesque">
                        <a href="#">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="butentrardoc">Entrar</button>

                    <p class="naotem">
                        Não tem uma conta?
                        <a href="TelaCad1Doc.html"><b>Cadastre-se</b></a>
                    </p>
                </form>

            </div>
        </div>
    </main>

    <script>
        document.getElementById('formLoginDoc').addEventListener('submit', function (e) {
            e.preventDefault();
            
            window.location.href = 'TelaCad1Doc.html';
        });
    </script>
</body>
</html>
