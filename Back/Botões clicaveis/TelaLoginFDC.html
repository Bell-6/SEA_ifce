<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login FDC</title>
    <link rel="stylesheet" href="TelaLoginFDC.css">
</head>
<body>
    <main>
        <div class="divmainlogdoc">
            <div class="esquerda">
                <img src="../../../assets/Banner.png" class="bannerdiv" alt="Banner">
            </div>

            <div class="direita">
                <div class="bottit">
                    <div class="divbutvot">
                        <a href="TelaLogin.html" class="botao-voltar">←</a>
                    </div>
                    <h1>Login</h1>
                </div>

                <form id="formLoginFDC">
                    <div class="divform">
                        <h4><label for="siape">SIAPE</label></h4>
                        <input type="text" inputmode="numeric" id="siape" name="siape" required>
                    </div>

                    <div class="divform">
                        <h4><label for="senha">Senha</label></h4>
                        <input type="password" id="senha" name="senha" required>
                    </div>

                    <div class="divesque">
                        <p class="pesqueceu"><a href="TelaCad3FDC.html">Esqueceu a senha?</a></p> 
                    </div>
        
                    <button type="submit" class="butentrardoc">Entrar</button>

                    <p class="naotem">Não tem uma conta? 
                        <a href="TelaCad1FDC.html"><b>Cadastre-se</b></a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('formLoginFDC').addEventListener('submit', function (e) {
            e.preventDefault();
            window.location.href = 'TelaCad1FDC.html';
        });
    </script>
</body>
</html>
