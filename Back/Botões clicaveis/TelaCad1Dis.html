<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="TelaCad1Dis.css">
    <title>Seus Dados</title>
</head>
<body>
    <main>
        <div class="divmain">
            <div class="esquerda">
                <img src="../../../assets/Banner.png" class="banner" alt="Banner">
            </div>

            <div class="direita">
                <div class="titulo">
                    <a href="TelaLogin.html" class="seta">く</a>
                    <h2 class="seus">Seus Dados</h2>
                </div>

                <form id="formCad1Dis">
                    <div class="divinput">
                        <h3>Nome de usuário</h3>
                        <input type="text" id="nome" name="nome" placeholder="nome" required>
                    </div>

                    <div class="divinput">
                        <h3>Matrícula</h3>
                        <input type="text" inputmode="numeric" id="matricula" name="matricula" placeholder="número de identificação" required>
                    </div>

                    <div class="divinput">
                        <h3>Senha</h3>
                        <input type="password" id="senha" name="senha" placeholder="senha" required>
                    </div>

                    <div class="divinput">
                        <h3>Confirmar senha</h3>
                        <input type="password" id="consenha" name="consenha" placeholder="senha" required>
                    </div>

                    <div class="progresso">
                        <div class="barra ativa"></div>
                        <div class="barra"></div>
                        <div class="barra"></div>
                        <div class="barra"></div>
                    </div>

                    <button type="submit" class="butconti1doc">Continuar</button>

                    <p class="jatem">Já tem uma conta? 
                        <a href="TelaLoginDis.html" class="facalo"><b>Faça login</b></a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('formCad1Dis').addEventListener('submit', function (e) {
            e.preventDefault();

            const senha = document.getElementById('senha').value;
            const confirma = document.getElementById('consenha').value;

            if (senha !== confirma) {
                alert('As senhas não coincidem!');
                return;
            }

            sessionStorage.setItem('nome', document.getElementById('nome').value);
            sessionStorage.setItem('matricula', document.getElementById('matricula').value);

            window.location.href = 'TelaCad2Dis.html';
        });
    </script>
</body>
</html>
